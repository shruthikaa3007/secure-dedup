services:
  - type: web
    name: secure-dedup
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: STORAGE_BACKEND
        value: filesystem
      - key: REQUIRE_API_KEY
        value: "true"
      - key: API_KEYS
        value: dev-api-key
      - key: MODEL_DIR
        value: advanced_artifacts
      - key: TELEMETRY_DB
        value: /var/data/telemetry.db
      - key: LOCAL_CHUNK_DIR
        value: /var/data/local_chunks
      - key: ADAPTIVE_POW_ENABLED
        value: "true"
      - key: CHUNK_ENCRYPTION_STRICT
        value: "false"
    disk:
      name: secure-dedup-data
      mountPath: /var/data
      sizeGB: 1
